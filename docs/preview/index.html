<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyTrace — インタラクティブUIプレビュー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1621'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%235FD4C8' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%235FD4C8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="pagehead">
  <b>SkyTrace</b> — インタラクティブUIプレビュー（SwiftUIアプリの操作可能なWebプレビュー）
  <div class="pill">実fixtureデータ由来 · 未コンパイル · タブ／事例／課金導線を操作できます</div>
</div>

<div class="phone">
  <div class="cosmos" id="cosmos" aria-hidden="true"></div>
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>SkyTrace</span><span>▮▮▮ 100%</span></div>
  <div class="nav" id="nav"></div>
  <div class="screen" id="screen">読み込み中…</div>
  <div class="tabbar" id="tabbar"></div>
  <div id="sheetHost"></div>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-sky"></div>
    <div class="splash-orb"></div>
    <div class="splash-mark">
      <div class="splash-glyph">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="20" fill="none" stroke="#7FE6DC" stroke-width="1.6"/>
          <circle cx="36" cy="36" r="30" fill="none" stroke="#7FE6DC" stroke-opacity="0.4" stroke-width="1"/>
          <circle cx="36" cy="36" r="3.4" fill="#7FE6DC"/>
        </svg>
      </div>
      <div class="splash-title">SkyTrace</div>
      <div class="splash-tag">世界の空に残された、まだ名前のないものを丁寧に記録する。</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
